services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "18000:8000"
    env_file:
      - .env
    environment:
      PM_DB_PATH: /app/data/pm.sqlite3
    volumes:
      - ./backend/data:/app/data
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  static:
    build:
      context: .
      dockerfile: frontend/Dockerfile.export
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
